name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: module.json version and download match the tag
        run: |
          v=$(jq -r .version module.json)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "::error::module.json version $v does not match tag $GITHUB_REF_NAME"; exit 1; fi
          d=$(jq -r .download module.json)
          case "$d" in *"/$GITHUB_REF_NAME/"*) ;; *) echo "::error::module.json download $d is not for $GITHUB_REF_NAME"; exit 1;; esac
      - run: zip -r module.zip module.json scripts templates styles lang samples LICENSE README.md
      - name: GitHub release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" module.zip module.json --title "$GITHUB_REF_NAME" --notes-file notes.md
